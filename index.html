<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health & Fitness Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Fitness & Strength Dashboard</h1>
      <nav class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
        <button class="tab-btn" onclick="switchTab('sessions')">Strength Sessions</button>
      </nav>
    </header>

    <main class="tab-content">
      <!-- Dashboard View -->
      <section id="dashboard" class="tab-panel active">
        <div class="charts-grid">
          <div class="chart-card">
            <h3>Progress Overview</h3>
            <div class="chart-wrapper">
              <canvas id="fitnessChart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <h3>Strength Metrics</h3>
            <div class="chart-wrapper">
              <canvas id="strengthChart"></canvas>
            </div>
          </div>
        </div>
      </section>

      <!-- Sessions View -->
      <section id="sessions" class="tab-panel">
        <div class="table-container">
          <table id="sessionsTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Exercise</th>
                <th>Sets x Reps</th>
                <th>Weight (kg)</th>
              </tr>
            </thead>
            <tbody id="sessionsBody"></tbody>
          </table>
          <button id="loadMoreBtn" class="btn-secondary" onclick="renderMoreSessions()">Load Older Sessions</button>
        </div>
      </section>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
